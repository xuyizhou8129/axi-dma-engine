<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DMA Engine Visualizer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>⚡ DMA Architecture Visualizer</h1>
    <div class="controls">
      <button id="playBtn">▶ Play Demo</button>
      <button id="stepBtn">⏭ Step</button>
      <button id="pauseBtn">⏸ Pause</button>
      <label>Speed: <input id="speed" type="range" min="0.25" max="3" value="1" step="0.25"></label>
      <span id="stage" aria-live="polite">Ready</span>
      <button id="themeBtn">🌙 Dark</button>
    </div>
  </header>

  <main>
    <section id="canvas">
      <!-- Reference-style architecture diagram rebuilt as vector SVG -->
      <svg id="arch" viewBox="0 0 980 888" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <defs>
          <!-- Arrow markers for dark and light modes -->
          <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 12 6 L 0 12 Z" fill="#6b7280" stroke="none" />
          </marker>
          <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 12 6 L 0 12 Z" fill="#a3a3a3" stroke="none" />
          </marker>
          
          <!-- Material Design Gradients -->
          <linearGradient id="gradCyan" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4de8ff;stop-opacity:0.18" />
            <stop offset="100%" style="stop-color:#4de8ff;stop-opacity:0.04" />
          </linearGradient>
          <linearGradient id="gradMagenta" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ff66ff;stop-opacity:0.18" />
            <stop offset="100%" style="stop-color:#ff66ff;stop-opacity:0.04" />
          </linearGradient>
          <linearGradient id="gradBlue" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#5588ff;stop-opacity:0.16" />
            <stop offset="100%" style="stop-color:#5588ff;stop-opacity:0.04" />
          </linearGradient>
          <linearGradient id="gradGreen" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#66ff66;stop-opacity:0.16" />
            <stop offset="100%" style="stop-color:#66ff66;stop-opacity:0.04" />
          </linearGradient>
          
          <!-- Material elevation shadow -->
          <filter id="shadow-elevation" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" />
            <feOffset dx="0" dy="2" result="offsetblur" />
            <feFlood flood-color="#000000" flood-opacity="0.16" />
            <feComposite in2="offsetblur" operator="in" result="fcShadow" />
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" />
            <feOffset dx="0" dy="1" result="offsetblur" />
            <feFlood flood-color="#000000" flood-opacity="0.08" />
            <feComposite in2="offsetblur" operator="in" result="fcShadow2" />
            <feMerge>
              <feMergeNode in="fcShadow" />
              <feMergeNode in="fcShadow2" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <rect x="0" y="0" width="980" height="888" fill="var(--bg-secondary)" />

        <!-- DMA Unit Container -->
        <g id="dma-container">
          <rect x="20" y="174" width="920" height="580" fill="none" stroke="var(--border-color)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5" rx="8" />
          <text x="38" y="195" class="label" font-size="14" font-weight="700" fill="var(--text-secondary)">DMA Control Unit</text>
        </g>

        <g id="socBus">
          <rect class="box box-ctrl" x="250" y="56" width="250" height="74" rx="6" ry="6" fill="url(#gradCyan)" filter="url(#shadow-elevation)" />
          <text class="label" x="375" y="100" text-anchor="middle" font-size="14" font-weight="600">SoC Bus (AXI-Lite)</text>
        </g>

        <g id="cpu_interrupt_pin">
          <text class="label" x="610" y="70" font-size="18">CPU Interrupt</text>
          <text class="label" x="610" y="92" font-size="18">Pin</text>
        </g>

        <g id="csr">
          <rect class="box box-ctrl" x="270" y="272" width="155" height="80" rx="6" ry="6" fill="url(#gradCyan)" filter="url(#shadow-elevation)" />
          <text class="label" x="347.5" y="320" text-anchor="middle" font-size="16" font-weight="700">CSR</text>
        </g>

        <g id="irq">
          <rect class="box box-ctrl" x="465" y="272" width="150" height="80" rx="6" ry="6" fill="url(#gradCyan)" filter="url(#shadow-elevation)" />
          <text class="label" x="540" y="320" text-anchor="middle" font-size="16" font-weight="700">IRQ</text>
        </g>

        <g id="ring">
          <rect class="box box-ring" x="40" y="486" width="180" height="74" rx="6" ry="6" fill="url(#gradGreen)" filter="url(#shadow-elevation)" />
          <text class="label" x="130" y="531" text-anchor="middle" font-size="14" font-weight="700">Ring Manager</text>
        </g>

        <g id="desc">
          <rect class="box box-fetch" x="345" y="486" width="185" height="74" rx="6" ry="6" fill="url(#gradBlue)" filter="url(#shadow-elevation)" />
          <text class="label" x="437.5" y="521" text-anchor="middle" font-size="13" font-weight="700">Descriptor</text>
          <text class="label" x="437.5" y="543" text-anchor="middle" font-size="13" font-weight="700">Fetcher</text>
        </g>

        <g id="dataMover">
          <rect class="box box-mover" x="650" y="486" width="180" height="74" rx="6" ry="6" fill="url(#gradMagenta)" filter="url(#shadow-elevation)" />
          <text class="label" x="740" y="531" text-anchor="middle" font-size="14" font-weight="700">Data Mover</text>
        </g>

        <g id="df_in_fifo">
          <rect class="box box-fifo" x="234" y="472" width="68" height="24" rx="4" ry="4" fill="url(#gradCyan)" filter="url(#shadow-elevation)" />
          <text class="label" x="268" y="486" text-anchor="middle" font-size="10" font-weight="600">FIFO</text>
        </g>

        <g id="df_out_fifo">
          <rect class="box box-fifo" x="556" y="472" width="68" height="24" rx="4" ry="4" fill="url(#gradBlue)" filter="url(#shadow-elevation)" />
          <text class="label" x="590" y="486" text-anchor="middle" font-size="10" font-weight="600">FIFO</text>
        </g>

        <g id="mid_fifo">
          <rect class="box box-fifo" x="466" y="612" width="68" height="24" rx="4" ry="4" fill="url(#gradBlue)" filter="url(#shadow-elevation)" />
          <text class="label" x="500" y="626" text-anchor="middle" font-size="10" font-weight="600">FIFO</text>
        </g>

        <g id="dm_sram_fifo">
          <rect class="box box-fifo" x="176" y="640" width="68" height="24" rx="4" ry="4" fill="url(#gradMagenta)" filter="url(#shadow-elevation)" />
          <text class="label" x="210" y="654" text-anchor="middle" font-size="10" font-weight="600">FIFO</text>
        </g>

        <g id="dm_axi_fifo">
          <rect class="box box-fifo" x="776" y="640" width="68" height="24" rx="4" ry="4" fill="url(#gradBlue)" filter="url(#shadow-elevation)" />
          <text class="label" x="810" y="654" text-anchor="middle" font-size="10" font-weight="600">FIFO</text>
        </g>

        <g id="sram_ctrl">
          <rect class="box box-ctrl" x="95" y="714" width="160" height="72" rx="6" ry="6" fill="url(#gradMagenta)" filter="url(#shadow-elevation)" />
          <text class="label" x="175" y="758" text-anchor="middle" font-size="14" font-weight="700">SRAM Controller</text>
        </g>

        <g id="axi">
          <rect class="box box-axi" x="670" y="714" width="170" height="72" rx="6" ry="6" fill="url(#gradBlue)" filter="url(#shadow-elevation)" />
          <text class="label" x="755" y="758" text-anchor="middle" font-size="14" font-weight="700">AXI4 Master</text>
        </g>

        <g id="sram">
          <rect class="box box-mem" x="112" y="818" width="126" height="62" rx="6" ry="6" fill="url(#gradGreen)" filter="url(#shadow-elevation)" />
          <text class="label" x="175" y="856" text-anchor="middle" font-size="14" font-weight="700">SRAM</text>
        </g>

        <g id="sysmem">
          <rect class="box box-mem" x="688" y="818" width="134" height="62" rx="6" ry="6" fill="url(#gradGreen)" filter="url(#shadow-elevation)" />
          <text class="label" x="755" y="856" text-anchor="middle" font-size="13" font-weight="700">System Memory</text>
        </g>

        <path id="p_soc_csr" class="line transparent-path" d="M 375 130 L 375 272" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)" />
        <path id="p_csr_ring" class="line transparent-path" d="M 270 312 L 220 312 L 220 486 L 130 486" marker-end="url(#arrow-dark)" />
        <path id="p_ring_df_in" class="line transparent-path" d="M 220 523 L 220 484 L 234 484" marker-end="url(#arrow-dark)" />
        <path id="p_df_in_desc" class="line transparent-path" d="M 302 484 L 345 484" marker-end="url(#arrow-dark)" />
        <path id="p_desc_df_out" class="line transparent-path" d="M 530 523 L 590 523 L 590 496" marker-end="url(#arrow-dark)" />
        <path id="p_df_out_dm" class="line transparent-path" d="M 624 484 L 650 484" marker-end="url(#arrow-dark)" />
        <path id="p_dm_axi_fifo" class="line transparent-path" d="M 810 560 L 810 640" marker-end="url(#arrow-dark)" />
        <path id="p_dm_sram_fifo" class="line transparent-path" d="M 650 560 L 650 652 L 244 652" marker-end="url(#arrow-dark)" />
        <path id="p_axi_fifo_axi" class="line transparent-path" d="M 810 662 L 810 714" marker-end="url(#arrow-dark)" />
        <path id="p_axi_mid" class="line transparent-path" d="M 755 714 L 626 714 L 626 636 L 500 636" marker-end="url(#arrow-dark)" />
        <path id="p_sramctrl_bram" class="line transparent-path" d="M 175 786 L 175 818" marker-end="url(#arrow-dark)" />
        <path id="p_axi_sysmem" class="line transparent-path" d="M 755 786 L 755 818" marker-end="url(#arrow-dark)" />
        <path id="p_sysmem_axi" class="line transparent-path" d="M 755 818 L 755 786" marker-end="url(#arrow-dark)" />
        <path id="p_sramctrl_sram" class="line transparent-path" d="M 175 818 L 175 786" marker-end="url(#arrow-dark)" />
        <path id="p_sram_fifo_ctrl" class="line transparent-path" d="M 210 664 L 210 714" marker-end="url(#arrow-dark)" />

        <!-- CSR <-> IRQ -->
        <path id="p_csr_irq" class="line transparent-path" d="M 425 312 L 465 312" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)" />

        <!-- Ring Manager direct to Descriptor Fetcher (notification path) -->
        <path id="p_ring_desc" class="line transparent-path" d="M 220 523 L 345 523" marker-end="url(#arrow-dark)" />

        <!-- mid FIFO feedback up to Descriptor Fetcher -->
        <path id="p_mid_df" class="line transparent-path" d="M 500 612 L 500 560" marker-end="url(#arrow-dark)" />

        <!-- IRQ connections -->
        <path id="p_ring_irq" class="line transparent-path" d="M 130 486 L 130 248 L 540 248 L 540 272" marker-end="url(#arrow-dark)" />
        <path id="p_dm_irq" class="line transparent-path" d="M 740 486 L 740 254 L 615 254 L 615 312" marker-end="url(#arrow-dark)" />
        <path id="p_irq_cpu" class="line transparent-path" d="M 590 272 L 590 100" marker-end="url(#arrow-dark)" />

        

 
</svg>
      </svg>
    </section>

    <aside id="log">
      <h2>Terminal Output</h2>
      <div id="events"></div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
