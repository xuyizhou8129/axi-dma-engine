<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DMA Engine Visualizer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>⚡ DMA Architecture Visualizer</h1>
    <div class="controls">
      <button id="playBtn">▶ Play Demo</button>
      <button id="pauseBtn">⏸ Pause</button>
      <label>Speed: <input id="speed" type="range" min="0.25" max="3" value="1" step="0.25"></label>
    </div>
  </header>

  <main>
    <section id="canvas">
      <!-- High-fidelity SVG based on DMA.drawio.png -->
      <svg id="arch" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L0,6 L6,3 z" fill="#555" id="markerPath"/>
          </marker>
          <marker id="arrow-glow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L0,6 L6,3 z" fill="#0ff" />
          </marker>
        </defs>

        <!-- Outer Boundary -->
        <rect x="50" y="100" width="900" height="450" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="8,4" rx="8"/>
        <text x="70" y="130" fill="#444" font-family="sans-serif" font-size="16">DMA Unit Boundary</text>

        <!-- Paths/Lines between components -->
        <!-- SoC to CSR -->
        <path id="p_soc_csr" class="line" d="M350 70 L350 150" marker-end="url(#arrow)"/>
        <!-- CSR to Ring Manager -->
        <path id="p_csr_ring" class="line" d="M250 180 L180 180 L180 250" marker-end="url(#arrow)"/>
        <!-- Ring Manager to Desc Fetcher -->
        <path id="p_ring_desc" class="line" d="M260 280 L400 280" marker-end="url(#arrow)"/>
        <!-- Desc Fetcher to Data Mover -->
        <path id="p_desc_dm" class="line" d="M600 280 L700 280" marker-end="url(#arrow)"/>
        <!-- Desc Fetcher to AXI Master -->
        <path id="p_desc_axi" class="line" d="M500 310 L500 370 L650 370 L650 400" marker-end="url(#arrow)"/>
        <!-- Data Mover to SRAM Ctrl -->
        <path id="p_dm_sram_ctrl" class="line" d="M750 310 L750 360 L250 360 L250 400" marker-end="url(#arrow)"/>
        <!-- Data Mover to AXI Master -->
        <path id="p_dm_axi" class="line" d="M800 310 L800 400" marker-end="url(#arrow)"/>
        
        <!-- AXI Master <-> Sys Mem -->
        <path id="p_axi_sysmem" class="line" d="M750 460 L750 580" marker-end="url(#arrow)"/>
        <path id="p_sysmem_axi" class="line" d="M720 580 L720 460" marker-end="url(#arrow)"/>
        
        <!-- SRAM Ctrl <-> SRAM -->
        <path id="p_sramctrl_sram" class="line" d="M220 460 L220 580" marker-end="url(#arrow)"/>
        <path id="p_sram_sramctrl" class="line" d="M280 580 L280 460" marker-end="url(#arrow)"/>

        <!-- External Interfaces -->
        <g id="socBus">
          <rect class="box" x="250" y="10" width="200" height="60" />
          <text class="label" x="350" y="45" text-anchor="middle">SoC Bus (AXI-Lite)</text>
        </g>
        
        <g id="sysmem">
          <rect class="box" x="650" y="580" width="180" height="60" />
          <text class="label" x="740" y="615" text-anchor="middle">System Memory</text>
        </g>
        
        <g id="sram">
          <rect class="box" x="160" y="580" width="180" height="60" />
          <text class="label" x="250" y="615" text-anchor="middle">On-Chip SRAM</text>
        </g>

        <!-- Internal Modules -->
        <g id="csr">
          <rect class="box" x="250" y="150" width="160" height="60" />
          <text class="label" x="330" y="185" text-anchor="middle">CSR</text>
        </g>

        <g id="irq">
          <rect class="box" x="500" y="150" width="160" height="60" />
          <text class="label" x="580" y="185" text-anchor="middle">IRQ</text>
        </g>

        <g id="ring">
          <rect class="box" x="100" y="250" width="160" height="60" />
          <text class="label" x="180" y="285" text-anchor="middle">Ring Manager</text>
        </g>

        <g id="desc">
          <rect class="box" x="400" y="250" width="200" height="60" />
          <text class="label" x="500" y="285" text-anchor="middle">Descriptor Fetcher</text>
        </g>

        <g id="dataMover">
          <rect class="box" x="700" y="250" width="160" height="60" />
          <text class="label" x="780" y="285" text-anchor="middle">Data Mover</text>
        </g>

        <g id="sram_ctrl">
          <rect class="box" x="160" y="400" width="180" height="60" />
          <text class="label" x="250" y="435" text-anchor="middle">SRAM Controller</text>
        </g>

        <g id="axi">
          <rect class="box" x="650" y="400" width="180" height="60" />
          <text class="label" x="740" y="435" text-anchor="middle">AXI4 Master</text>
        </g>

      </svg>
    </section>

    <aside id="log">
      <h2>Terminal Output</h2>
      <div id="events"></div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
